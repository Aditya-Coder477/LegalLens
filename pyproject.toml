[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "legallens-pipeline"
version = "1.0.0"
description = "Automated Indian Legal Data Collection Pipeline for LegalLens GenAI Platform"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --cov=pipeline --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

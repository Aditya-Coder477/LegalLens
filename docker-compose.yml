version: '3.8'

services:
  postgres-pgvector:
    image: pgvector/pgvector:pg16
    container_name: legallens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: legallens_user
      POSTGRES_PASSWORD: legallens_password
      POSTGRES_DB: legallens_kb
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legallens_user -d legallens_kb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
    driver: local
